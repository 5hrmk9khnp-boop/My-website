<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій сайт ✨</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f8d8ff, #dcd0ff, #cce7ff);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #3d3152;
        }

        .card {
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(80, 50, 100, 0.2);
            animation: appear 1s ease;
        }

        .hello {
            font-size: 70px;
            animation: wave 2s infinite;
            display: inline-block;
        }

        h1 {
            font-size: 38px;
            margin: 15px 0;
            color: #7b4aa8;
        }

        p {
            font-size: 19px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #9b6dcc;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 18px;
            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.08);
            background: #8052b0;
        }

        .stars {
            font-size: 22px;
            margin-top: 20px;
        }

        @keyframes wave {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(15deg);
            }
            50% {
                transform: rotate(-10deg);
            }
            75% {
                transform: rotate(15deg);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="hello">👋</div>

        <h1>Привіт! ✨</h1>

        <p>
            Ласкаво прошу на мій сайт 💜
            <br>
            Це мій перший маленький вебсайт!
        </p>

        <a class="button" href="https://www.google.com">
            Натисни мене ✨
        </a>

        <div class="stars">
            ✨ 🌸 💜 🌙 ✨
        </div>

    </div>

</body>
</html>
